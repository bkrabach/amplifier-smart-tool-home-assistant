name: Bug report
description: Report a reproducible problem with this tool.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, device inventory, household data, or raw logs.
        Report security vulnerabilities privately through SECURITY.md instead.
  - type: dropdown
    id: version
    attributes:
      label: Tool version
      options:
        - Latest public 0.8.x
        - Another 0.8.x version
        - Other or unknown
    validations:
      required: true
  - type: input
    id: linux
    attributes:
      label: Linux distribution and version
      placeholder: "Example: Fedora 42"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "Example: 3.13.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Sanitized reproduction steps
      description: Use synthetic names and values. Do not attach raw logs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and security check
      options:
        - label: I checked SECURITY.md and removed secrets and private household information.
          required: true